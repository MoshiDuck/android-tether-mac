# Rotation du journal de rndis-tether par newsyslog(8) (lancé toutes les heures par macOS).
# Installé par install.sh dans /etc/newsyslog.d/rndis-tether.conf.
#
# logfilename                  [owner:group]  mode count size  when  flags
#   count 5   : garde cinq anciens journaux
#   size 1024 : tourne au-delà de 1 Mo
#   when *    : seulement selon la taille
#   J         : compresse les anciens journaux (bzip2)
#   N         : n'envoie aucun signal : le superviseur rouvre lui-même le fichier (voir log_reopen_if_rotated)
/var/log/rndis-tether.log      root:wheel     644  5     1024  *     JN
